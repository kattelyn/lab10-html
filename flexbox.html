<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лабораторна №10 — flexbox</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f6f8} .topbar{padding:12px 18px;background:white;color:#394454;display:flex;gap:20px;align-items:center;flex-wrap:wrap}a{color:#356e9d}h1{font-size:20px;margin:0 12px 0 0}.wrapper{width:100%;height:calc(100vh - 55px);min-height:420px;padding:3px;gap:3px}.block{border:1px solid #f3f3f3;min-width:0;min-height:0}.blue{background:#5c9fd3}.cyan{background:#54c9c9}.red{background:#e16a6d}.yellow{background:#ffc20a}.green{background:#2ca77b}.gray{background:#718185}.orange{background:#c65b10}

.wrapper{display:flex;flex-direction:column}.upper{display:flex;gap:3px;flex:1;min-height:0}.main{display:flex;flex-direction:column;gap:3px;flex:4;min-width:0}.gray{flex:1}.blue{flex:1.15}.middle{display:flex;gap:3px;flex:1.8;min-height:0}.left{display:flex;flex-direction:column;gap:3px;flex:3}.pair{display:flex;gap:3px;flex:1}.cyan,.red{flex:1}.green{flex:1}.yellow{flex:2}.orange{height:16%;min-height:50px}
@media(min-width:1200px){.main{flex:4}.gray{flex:1}}
@media(min-width:950px) and (max-width:1199px){.main{flex:3}.gray{flex:1}}
@media(min-width:750px) and (max-width:949px){.main{flex:2}.gray{flex:1}}
@media(min-width:500px) and (max-width:749px){.upper{flex-direction:column}.main{flex:4}.gray{flex:1}.orange{height:12%}}
@media(max-width:499px){.wrapper{height:auto;min-height:calc(100vh - 90px)}.upper,.middle,.pair{flex-direction:column}.upper,.main,.middle,.left,.pair{flex:auto}.block{flex:auto;min-height:85px}.orange{height:70px}.blue{min-height:120px}}

</style>
</head>
<body>
<header class="topbar"><h1>Лабораторна робота №10</h1><a href="index.html">Головна</a><a href="float.html">Float</a><a href="flexbox.html">Flexbox</a><a href="grid.html">Grid</a></header>
<main class="wrapper"><section class="upper"><div class="main"><div class="block blue"></div><div class="middle"><div class="left"><div class="pair"><div class="block cyan"></div><div class="block red"></div></div><div class="block green"></div></div><div class="block yellow"></div></div></div><div class="block gray"></div></section><div class="block orange"></div></main>
</body>
</html>
