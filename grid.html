<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лабораторна №10 — grid</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f6f8} .topbar{padding:12px 18px;background:white;color:#394454;display:flex;gap:20px;align-items:center;flex-wrap:wrap}a{color:#356e9d}h1{font-size:20px;margin:0 12px 0 0}.wrapper{width:100%;height:calc(100vh - 55px);min-height:420px;padding:3px;gap:3px}.block{border:1px solid #f3f3f3;min-width:0;min-height:0}.blue{background:#5c9fd3}.cyan{background:#54c9c9}.red{background:#e16a6d}.yellow{background:#ffc20a}.green{background:#2ca77b}.gray{background:#718185}.orange{background:#c65b10}

.wrapper{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:1.15fr .8fr 1fr .55fr}
.blue{grid-area:1/1/2/10}.cyan{grid-area:2/1/3/4}.red{grid-area:2/4/3/7}.yellow{grid-area:2/7/4/10}.green{grid-area:3/1/4/7}.gray{grid-area:1/10/4/13}.orange{grid-area:4/1/5/13}
@media(max-width:1199px){.wrapper{grid-template-columns:repeat(9,minmax(0,1fr))}.blue{grid-area:1/1/2/7}.cyan{grid-area:2/1/3/3}.red{grid-area:2/3/3/5}.yellow{grid-area:2/5/4/7}.green{grid-area:3/1/4/5}.gray{grid-area:1/7/4/10}.orange{grid-area:4/1/5/10}}
@media(max-width:949px){.wrapper{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:1fr .75fr 1fr .7fr .5fr}.blue{grid-area:1/1/2/7}.cyan{grid-area:2/1/3/4}.red{grid-area:2/4/3/7}.yellow{grid-area:3/4/4/7}.green{grid-area:3/1/4/4}.gray{grid-area:4/1/5/7}.orange{grid-area:5/1/6/7}}
@media(max-width:749px){.wrapper{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:1fr .7fr .7fr .7fr .55fr}.blue{grid-area:1/1/2/3}.cyan{grid-area:2/1/3/2}.red{grid-area:2/2/3/3}.yellow{grid-area:3/2/5/3}.green{grid-area:3/1/4/2}.gray{grid-area:4/1/5/2}.orange{grid-area:5/1/6/3}}
@media(max-width:499px){.wrapper{height:auto;min-height:calc(100vh - 90px);display:flex;flex-direction:column}.block{min-height:85px;flex:1}.blue{min-height:120px}.orange{min-height:65px}}

</style>
</head>
<body>
<header class="topbar"><h1>Лабораторна робота №10</h1><a href="index.html">Головна</a><a href="float.html">Float</a><a href="flexbox.html">Flexbox</a><a href="grid.html">Grid</a></header>
<main class="wrapper"><div class="block blue" title="Верхній блок"></div><div class="block cyan" title="Бірюзовий блок"></div><div class="block red" title="Червоний блок"></div><div class="block yellow" title="Жовтий блок"></div><div class="block green" title="Зелений блок"></div><div class="block gray" title="Правий блок"></div><div class="block orange" title="Нижній блок"></div></main>
</body>
</html>
